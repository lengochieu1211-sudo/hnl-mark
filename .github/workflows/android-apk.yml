name: HNLMark Android APK (DEV)
on:
  push:
    branches: [dev]
    paths:
      - 'android/**'
      - 'app.js'
      - 'video.js'
      - 'index.html'
      - 'style.css'
      - 'orientation.js'
      - 'crop-ratios.js'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'hnl-logo-*.png'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install SDK 35 (use preinstalled command-line tools)
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Install Pillow for lossless launcher-mask conversion
        run: python3 -m pip install --disable-pip-version-check pillow==11.1.0
      - name: Bundle offline HTML and native Android UI
        run: |
          python3 android/scripts/package_web.py
          python3 android/scripts/audit_android.py
          node --check android/android-app.js
          python3 tests/test_android_picker_source.py
          python3 tests/test_android_polish_v257.py
          node --check camera-controls.js
          node --check android/android-camera-v25.js
          node --check android/android-select-v25.js
          node --check android/android-ux-v251.js
          node --check android/android-polish-v257.js
          node --check android/preview-geometry.js
          node tests/test_android_preview_geometry.cjs
          node --check app.js
          node --check video.js
      - name: Compile debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: SHA-256 checksum
        run: |
          cd android/app/build/outputs/apk/debug
          sha256sum app-debug.apk > SHA256.txt
          cat SHA256.txt
      - name: Publish installable Android DEV APK
        uses: actions/upload-artifact@v4
        with:
          name: HNLMark-Android-DEV-APK
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/SHA256.txt
          if-no-files-found: error
          retention-days: 30
