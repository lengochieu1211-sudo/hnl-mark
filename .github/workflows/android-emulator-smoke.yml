name: HNLMark Android Emulator UI smoke (DEV)
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/android-emulator-smoke.yml'
      - 'studio-ui/**'
      - 'android/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow and React UI dependencies
        run: |
          python3 -m pip install --disable-pip-version-check pillow==11.1.0
          npm install --prefix studio-ui --no-audit --no-fund
      - name: Enable hardware virtualization for Android Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android TEST14 APK in clean API 35 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: '-no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim'
          disable-animations: true
          script: |
            mkdir -p android-smoke-evidence
            python3 android/scripts/package_web.py
            python3 android/scripts/audit_android.py
            (cd android && gradle :app:assembleDebug --no-daemon)
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell pm grant vn.hnl.xaydung.hnlmark.trial2514 android.permission.CAMERA
            adb shell pm grant vn.hnl.xaydung.hnlmark.trial2514 android.permission.RECORD_AUDIO
            adb shell am start -W -n vn.hnl.xaydung.hnlmark.trial2514/vn.hnl.xaydung.hnlmark.MainActivity
            sleep 12
            adb shell pidof vn.hnl.xaydung.hnlmark.trial2514 | tee android-smoke-evidence/pid.txt
            adb exec-out screencap -p > android-smoke-evidence/studio-camera-emulator.png
            # The Pixel_5 emulator is 1080x2340. Real camera button center:
            # use screenshots as evidence instead of trusting button clicks alone.
            adb shell input tap 540 2160
            sleep 7
            adb exec-out screencap -p > android-smoke-evidence/studio-after-shutter.png
            adb shell ls -l /sdcard/Pictures/HNLMark > android-smoke-evidence/public-pictures.txt 2>&1 || true
            if ! grep -Ei '\\.(jpg|jpeg|png)' android-smoke-evidence/public-pictures.txt; then
              echo 'FAIL: shutter did not create an image in Pictures/HNLMark'
              cat android-smoke-evidence/public-pictures.txt
              exit 1
            fi
            echo 'PASS: camera capture saved a real public device image' > android-smoke-evidence/capture-result.txt
            adb shell settings put system accelerometer_rotation 0
            adb shell settings put system user_rotation 1
            sleep 5
            adb exec-out screencap -p > android-smoke-evidence/studio-landscape-right.png
            adb shell settings put system user_rotation 3
            sleep 5
            adb exec-out screencap -p > android-smoke-evidence/studio-landscape-left.png
            adb shell settings put system user_rotation 0
            python3 - <<'PY'
from PIL import Image
from pathlib import Path
p=Path('android-smoke-evidence')
for name in ['studio-landscape-right.png','studio-landscape-left.png']:
    im=Image.open(p/name)
    print(name,im.size)
    if im.width <= im.height:
        raise SystemExit('FAIL: emulator screenshot not landscape: '+name)
print('PASS: emulator screen rotates into both landscape directions')
PY
            adb logcat -d -t 1200 > android-smoke-evidence/logcat.txt
            adb shell dumpsys window windows > android-smoke-evidence/windows.txt
            python3 -c "from PIL import Image; im=Image.open('android-smoke-evidence/studio-camera-emulator.png').convert('RGB'); assert im.width>=320 and im.height>=480; print('PASS: emulator screenshot',im.size)"
            if grep -q 'Process: vn.hnl.xaydung.hnlmark.trial2514' android-smoke-evidence/logcat.txt && grep -q 'FATAL EXCEPTION' android-smoke-evidence/logcat.txt; then echo 'FAIL: app crash detected'; exit 1; fi
            echo 'Emulator app boot + camera preview + shutter saved to Pictures/HNLMark + both landscape screenshot smoke PASS; physical Xiaomi camera/video/share still PENDING.' > android-smoke-evidence/RESULT.txt
      - name: Upload emulator screen and runtime logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HNLMark-STUDIO14-EMULATOR-EVIDENCE
          path: android-smoke-evidence/
          if-no-files-found: warn
          retention-days: 30
