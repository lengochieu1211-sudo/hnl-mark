plugins {
    id 'com.android.application'
}

android {
    namespace 'vn.hnl.xaydung.hnlmark'
    compileSdk 35
    defaultConfig {
        applicationId 'vn.hnl.xaydung.hnlmark'
        minSdk 29
        targetSdk 35
        versionCode 2516
        versionName '2.5.16-studio-test'
    }
    buildTypes {
        debug {
            debuggable true
            // Parallel installation: NEVER uninstall a previous HNLMark
            // while its offline photo library has not been ZIP-backed up.
            applicationIdSuffix '.trial2516'
            resValue 'string', 'hnlmark_application_name', 'HNLMark STUDIO 16'
        }
        release {
            resValue 'string', 'hnlmark_application_name', 'HNLMark'
            minifyEnabled false
            shrinkResources false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.15.0'
}
